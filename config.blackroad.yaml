# RoadHome — BlackRoad OS Smart Home Configuration
# Pi 5 + Hailo-8 + Ollama + MQTT + Home Assistant

system:
  name: "RoadHome"
  version: "3.0.0-blackroad"
  debug: false
  log_level: "INFO"
  data_dir: "/home/blackroad/roadhome-data"

# BlackRoad Fleet Hardware
hardware:
  hailo:
    enabled: true
    device_id: 0
    model_path: "/opt/hailo/models"
    tops: 26  # Hailo-8 = 26 TOPS per chip
  camera:
    enabled: true
    device: 0
    resolution: [1920, 1080]
    fps: 30
  audio:
    input_device: "USB Audio Device"
    output_device: "USB Audio Device"
    sample_rate: 16000
    channels: 1
  bluetooth:
    enabled: true
    scan_interval: 30
    known_devices:
      - name: "AppleTV"
        mac: "XX:XX:XX:XX:XX:XX"
        type: "media"
      - name: "Eero"
        mac: "XX:XX:XX:XX:XX:XX"
        type: "router"

# MQTT — connects to NATS bridge on Octavia
mqtt:
  broker: "192.168.4.101"  # Octavia
  port: 1883
  username: "roadhome"
  password: ""
  topics:
    voice_input: "road/home/voice/input"
    voice_output: "road/home/voice/output"
    vision_events: "road/home/vision/events"
    device_control: "road/home/devices/control"
    fleet_status: "road/fleet/status"

# Ollama — use Cecilia for heavy inference, local for fast
ollama:
  primary:
    host: "192.168.4.96"  # Cecilia
    port: 11434
    model: "qwen2.5:3b"
  fallback:
    host: "localhost"
    port: 11434
    model: "qwen2.5:1.5b"

# RoundTrip integration — report to the hub
roundtrip:
  url: "https://roundtrip.blackroad.io"
  agent_id: "hestia"  # Hestia is the hearth/home agent
  report_interval: 60

# Home Assistant
homeassistant:
  url: "http://localhost:8123"
  token: ""

# Vision models (Hailo-8 accelerated)
vision:
  detection_model: "yolov8s"
  face_model: "scrfd_500m"
  pose_model: "centerpose"
  confidence_threshold: 0.5
